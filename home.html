<body class="bg-[#F8FAFC] min-h-screen">

            <div class="flex-1 ">
                <div class=" sm:flex gap-2">
             
                    <img src="assets/Group.png" class="cursor-pointer">
                    <a class="btn btn-ghost text-xl px-0 hidden sm:inline">GitHub Issues Tracker</a>

                </div>

            </div>
            <div class="flex gap-2 items-center ">
                <div class="flex items-center px-2 gap-1 rounded-md border-2 border-[#E4E4E7]">
                    <i class="fa-brands fa-sistrix opacity-60"></i>
                    <input id="input" type="text" placeholder="Search issues..."
                        class=" input outline-0 border-0 w-24 md:w-auto pl-0 shadow-none" />

                </div>

                <button onclick="loadSearch()" class="btn btn-active btn-primary">+ New Issue</button>
            </div>
        </div>
    </section>


    <section class="w-5/6 mx-auto bg-white mt-10 mb-3 p-3 rounded-lg shadow-sm">
        <div class="space-x-2 space-y-2 ">
            <button onclick='btn1()' id="b1"
                class="btn px-10  bg-primary hover:bg-primary grayColor border-[#E4E4E7]">All</button>
            <button onclick='btn2()' id="b2"
                class="btn px-8  hover:bg-primary grayColor border-[#E4E4E7] ">Open</button>
            <button onclick='btn3()' id="b3"
                class="btn px-7  hover:bg-primary grayColor border-[#E4E4E7]  ">Closed</button>
        </div>
    </section>



    <section class="w-5/6 mx-auto bg-white p-3 rounded-t-lg shadow-sm flex justify-between">
        <div class="flex items-center gap-2">
            <div class="w-12 h-12 rounded-full flex justify-center items-center bg-[#ECE4FF]">
                <img src="assets/Aperture.png">
            </div>

            <div>
                <h2 class="text-[#1F2937] font-semibold text-xl"><span id="count">50</span> Issues</h2>
                <p class="text-[#64748B]">Track and manage your project issues</p>
            </div>
        </div>
        <div class="flex items-center">
            <!-- <ul class="flex items-center space-x-2"> -->
            <ul class="grid grid-cols-2 items-center p-3 space-x-1 sm:grid-cols-4">
                <li class="pl-6" ><img src="assets/Ellipse-1.png"></li>
                <li class="pr-2">Open</li>
                <li class="pl-6"> <img src="assets/Ellipse-2.png"></li>
                <li>Closed</li>
            </ul>

        </div>

    </section>

         <span class="loading loading-spinner loading-xl"></span>
    </div>
